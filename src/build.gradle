/**
 * Arquivo Gradle para construção do Projeto A3
 *
 * COMO USAR:
 *   1. Instale Gradle: https://gradle.org/install/
 *   2. Digite no diretório raiz do projeto:
 *
 *      gradle build          # compila e roda testes
 *      gradle test           # roda apenas os testes
 *      gradle run            # executa a classe main
 *      gradle jar            # gera JAR executável
 *
 * Gradle é uma alternativa ao Maven — mais concisa e poderosa.
 */

plugins {
    id 'java'
    id 'application'
}

/**
 * Informações do projeto
 */
group = 'com.banco.antifrau'
version = '1.0.0'
sourceCompatibility = '11'
targetCompatibility = '11'

/**
 * Configuração da aplicação executável
 */
application {
    mainClass = 'test.SegurancaServiceTest'
}

/**
 * Repositórios de onde baixar as dependências
 * Maven Central é o maior repositório Java público
 */
repositories {
    mavenCentral()
}

/**
 * Definição de dependências
 *
 * Sintaxe: <groupId>:<artifactId>:<version>
 *
 * - testImplementation: dependência usada apenas para compilar e rodar testes
 * - implementation: dependência usada na aplicação principal
 */
dependencies {
    // JUnit 4 — framework de testes unitários
    testImplementation 'junit:junit:4.13.2'

    // Hamcrest — biblioteca de matchers para assertions mais expressivas
    testImplementation 'org.hamcrest:hamcrest-core:1.3'
}

/**
 * Configuração de tarefas de teste
 */
test {
    // Usa JUnit 4 para rodar os testes
    useJUnit()

    // Exibe saída dos testes no console
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

/**
 * Configuração do JAR gerado
 */
jar {
    manifest {
        attributes(
            'Main-Class': 'test.SegurancaServiceTest',
            'Implementation-Title': 'Projeto A3 - Combate ao Golpe do Boleto Falso',
            'Implementation-Version': project.version
        )
    }
}
